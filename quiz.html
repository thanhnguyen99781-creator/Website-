<script>
// [số câu, câu hỏi, [A,B,C,D], chỉ số đáp án đúng (0=A)]
const Q=[
[1,"Một trong những phương hướng cơ bản XDLLVT nhân dân trong giai đoạn mới là gì ?",["Xây dựng lực lượng vũ trang nhân dân vững mạnh.","Xây dựng lực lượng dự bị động viên hùng hậu, được huấn luyện và quản lý tốt, bảo đảm khi cần thiết có thể động viên nhanh chóng theo kế hoạch.","Xây dựng lực lượng dân quân du kích, đặt dưới sự lãnh đạo của Đảng.","Xây dựng lực lượng du kích hùng hậu."],1],
[2,"Đâu là phương hướng cơ bản XDLLVT nhân dân trong giai đoạn mới?",["Xây dựng lực lượng vũ trang nhân dân vững mạnh đặt dưới sự lãnh đạo của Đảng.","Xây dựng lực lượng vũ trang nhân dân lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở.","Xây dựng lực lượng dân quân du kích, vững mạnh đặt dưới sự lãnh đạo của Đảng.","Cả ba ý trên."],1],
[3,"Một trong những quan điểm, nguyên tắc cơ bản xây dựng LL vũ trang nhân dân là gì?",["Xây dựng lực lượng vũ trang nhân dân có khả năng thích ứng với chiến tranh hiện đại.","Xây dựng lực lượng vũ trang nhân dân có khả năng tác chiến tốt, vũ khí trang bị hiện đại.","Xây dựng lực lượng vũ trang nhân dân có kỷ luật nghiêm, có sức mạnh chiến đấu tốt trong mọi điều kiện.","Đảm bảo cho LLVT nhân dân luôn trong tư thế sẵn sàng chiến đấu và chiến đấu thắng lợi."],3],
[4,"Vì sao lực lượng vũ trang nhân dân phải luôn trong tư thế sẵn sàng chiến đấu?",["Đây là quan điểm phản ánh chức năng, nhiệm vụ chủ yếu cơ bản, thường xuyên của LLVT ND.","Đây là nhiệm vụ thường xuyên, cơ bản trước mắt của lực lượng vũ trang nhân dân.","Đây là yêu cầu của thời kỳ công nghiệp hóa, hiện đại hóa đất nước.","Đây là nhiệm vụ cơ bản lâu dài của lực lượng vũ trang nhân dân Việt Nam."],0],
[5,"Tinh nhuệ về chính trị được thể hiện như thế nào?",["Đứng trước tình hình chính trị phức tạp trên thế giới phải biết phân biệt địch ta.","Đứng trước diễn biến của tình hình, có khả năng phân tích và kết luận chính xác đúng, sai từ đó có thái độ đúng đắn với sự việc đó.","Nắm bắt kịp thời tình hình trong nước và quốc tế.","Kiên quyết đấu tranh với các hiện tượng tiêu cực trong xã hội."],1],
[6,"Thực trạng về chính trị của lực lượng vũ trang nhân dân ta như thế nào?",["Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ, chiến sĩ ta rất tốt, sẵn sàng chiến đấu chống mọi kẻ thù.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của không ít cán bộ, chiến sĩ ta chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT.","Cán bộ, chiến sĩ ta có trình độ lí luận, tính nhạy bén, sắc sảo, sẵn sàng chiến đấu chống mọi kẻ thù xâm lược.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ, chiến sĩ ta còn yếu kém chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT."],1],
[7,"Thực trạng về trang bị của lực lượng vũ trang nhân dân ta như thế nào?",["Trang bị của lực lượng vũ trang hiện đại và đồng bộ.","Trang bị của lực lượng vũ trang còn lạc hậu và thiếu đồng bộ.","Trang bị của lực lượng vũ trang hiện nay nhiều nhưng chưa đồng bộ.","Trang bị của lực lượng vũ trang số lượng còn ít chưa đáp ứng cho chiến tranh hiện đại."],1],
[8,"Một trong những thực trạng của lực lượng vũ trang nhân dân ta là gì?",["Có khả năng chiến đấu và cơ động nhanh trên các loại địa hình còn hạn chế.","Khả năng chiến đấu và trình độ sẵn sàng chiến đấu của LLVT nhân dân còn có những mặt hạn chế.","Khả năng chiến đấu ở địa hình rừng núi của LL vũ trang nhân dân còn có mặt hạn chế.","Khả năng chiến đấu ở địa hình đồng bằng của lực LL VT nhân dân còn có mặt hạn chế."],1],
[9,"Một trong những thực trạng của lực lượng vũ trang nhân dân ta là gì?",["Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của một số cán bộ, chiến sĩ ta chưa đáp ứng tình hình mới.","Trên thực tế, trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của không ít cán bộ, chiến sĩ ta chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT trong cuộc đấu tranh bảo vệ Tổ quốc XHCN.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ Đảng viên có lúc còn hạn chế.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của một bộ phận Đảng viên chuyển biến chậm."],1],
[10,"Một trong những nội dung xây dựng quân đội theo hướng cách mạng là gì?",["Có tinh thần đoàn kết quân dân, đoàn kết nội bộ tốt.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, dân chủ rộng rãi.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, đoàn kết quốc tế tốt.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, tự giác nghiêm minh."],2],
[11,"Phương hướng xây dựng LLVT nhân dân trong thời kỳ mới là gì?",["Xây dựng QĐ, CAND theo hướng cách mạng, chính quy, tinh nhuệ, từng bước hiện đại.","Xây dựng lực lượng dự bị động viên hùng hậu, được huấn luyện và quản lý tốt, bảo đảm khi cần thiết có thể động viên nhanh chóng theo kế hoạch.","Xây dựng lực lượng dân quân tự vệ vững mạnh rộng khắp, lấy chất lượng là chính.","Cả 3 phương án trên."],3],
[12,"Dựa trên cơ sở nào để thực hiện kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh?",["Mối quan hệ kinh tế với quốc phòng, an ninh.","Nhiệm vụ phát triển kinh tế - xã hội và nhiệm vụ quốc phòng, an ninh.","Cơ sở lý luận và thực tiễn của sự kết hợp.","Hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc."],2],
[13,"Hiện nay để thực hiện thắng lợi hai nhiệm vụ chiến lược Đảng ta xác định như thế nào?",["Phải thực hiện đồng thời hai nhiệm vụ chiến lược xây dựng và bảo vệ.","Phải kết hợp chặt chẽ giữa phát triển kinh tế với phát triển quốc phòng, an ninh.","Phải kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh.","Phải tăng cường quốc phòng, an ninh gắn với phát triển kinh tế - xã hội."],2],
[14,"Vai trò của cả kinh tế đối với QP, AN như thế nào?",["Kinh tế quyết định sự lớn mạnh và phát triển của QP, AN.","Kinh tế quyết định đến nguồn gốc ra đời, sức mạnh của QP, AN.","Kinh tế quyết định đến sự tồn tại và phát triển lâu dài của QP, AN.","Kinh tế quyết định đến việc biên chế trang bị vũ khí, phương tiện cho quốc phòng, an ninh."],1],
[15,"Bản chất của chế độ kinh tế - xã hội quyết định như thế nào đối với quốc phòng, an ninh?",["Quyết định bản chất của nền quốc phòng.","Quyết định đến bản chất của quân đội và công an.","Quyết định đến bản chất của nền quốc phòng, an ninh.","Quyết định nguồn gốc ra đời và bản chất của quốc phòng, an ninh."],2],
[16,"Thực hiện kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh hiện nay, cả nước ta được chia thành mấy vùng kinh tế trọng điểm?",["Chia thành 6 vùng kinh tế trọng điểm.","Chia thành 4 vùng kinh tế trọng điểm.","Chia thành 3 vùng kinh tế trọng điểm.","Chia thành 5 vùng kinh tế trọng điểm."],2],
[17,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng - an ninh trong xác định chiến lược phát triển kinh tế - xã hội được thể hiện như thế nào?",["Theo kế hoạch thống nhất từ trung ương đến địa phương.","Ngay trong việc xây dựng hoàn thiện chiến lược phát triển kinh tế của quốc gia.","Theo chiến lược phát triển nền kinh tế đất nước.","Ngay trong chiến lược phát triển kinh tế và chiến lược phòng thủ quốc gia."],1],
[18,"Một trong những nội dung chính kết hợp kinh tế - QP, an ninh đối với vùng biên giới là gì?",["Tập trung trước hết vào xây dựng hoàn thiện chiến lược phát triển kinh tế XD thế trận QP, an ninh.","Nhà nước phải có cơ chế chính sách thỏa đáng động viên, khích lệ dân bám trụ biên giới sinh sống, làm ăn.","Tập trung xây dựng các xã trọng điểm về kinh tế và quốc phòng, an ninh. Trước hết, cần tập trung xây dựng phát triển hệ thống hạ tầng cơ sở.","Chú trọng đầu tư phát triển kinh tế - xã hội với xây dựng lực lượng vũ trang vững mạnh."],2],
[19,"Đối với vùng biển đảo nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh cần chú ý vấn đề gì?",["Phải quan tâm đến đầu tư phát triển kinh tế, củng cố quốc phòng, an ninh ở các vùng ven biển và các đảo.","Tập trung xây dựng các xã trọng điểm về kinh tế và quốc phòng, an ninh dọc theo bờ biển và trên các đảo.","Phải tổ chức tốt việc định canh, định cư và có chính sách phù hợp đặc biệt đối với các đảo.","Nhà nước phải có cơ chế chính sách thoả đáng động viên khích lệ dân ra đảo bám trụ làm ăn lâu dài."],3],
[20,"Trong nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh hiện nay cần phát triển công nghiệp quốc gia theo hướng nào?",["Ưu tiên đầu tư phát triển công nghiệp nặng một cách hợp lý.","Phát triển theo hướng mỗi nhà máy, xí nghiệp vừa có thể sản xuất hàng dân dụng vừa có thể sản xuất hàng quân sự.","Phát triển theo hướng mỗi nhà máy, xí nghiệp, cần lựa chọn SX các sản phẩm phù hợp.","Phát triển công nghiệp quốc gia theo hướng chuyên sâu trên một số lĩnh vực mũi nhọn."],1],
[21,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong các ngành, các lĩnh vực kinh tế chủ yếu nào?",["Kết hợp trong công nghiệp.","Kết hợp trong nông, lâm, ngư nghiệp.","Kết hợp trong giao thông vận tải, bưu điện, y tế, khoa học-công nghệ, giáo dục và xây dựng cơ bản.","Cả ba nội dung trên."],3],
[22,"Giải pháp: Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh cho các đối tượng, cần tập trung gì?",["Đối tượng bồi dưỡng.","Nội dung bồi dưỡng.","Hình thức bồi dưỡng.","Cả ba giải pháp trên."],3],
[23,"Một trong những nội dung kết hợp phát triển kinh tế-xã hội với tăng cường củng cố quốc phòng, an ninh trong nông, lâm, ngư nghiệp là gì?",["Phát triển đa dạng các loại hình dịch vụ trong nông lâm ngư nghiệp.","Đầu tư xây dựng phát triển cơ sở hạ tầng phục vụ đắc lực cho CNH, HĐH nông nghiệp, nông thôn.","Kết hợp nhằm khai thác có hiệu quả tiềm năng đất, rừng, biển, đảo và lực lượng lao động để phát triển đa dạng các ngành trong nông, lâm, ngư nghiệp.","Kết hợp phải nhằm đưa nông, lâm, ngư nghiệp phát triển theo hướng công nghiệp hoá, hiện đại hoá."],2],
[24,"Nội dung kết hợp phát triển kinh tế – xã hội với tăng cường củng cố quốc phòng, an ninh trong nông, lâm, ngư nghiệp nhằm bảo đảm vấn đề gì?",["Bảo đảm nhu cầu lương thực, thực phẩm nguyên liệu cho sản xuất và tiêu dùng của cả xã hội.","Bảo đảm an ninh lương thực và an ninh nông thôn góp phần tạo thế trận phòng thủ, “thế trận lòng dân” vững chắc.","Bảo đảm thắng lợi cho công cuộc CNH, HĐH nông nghiệp, nông thôn hiện nay.","Nhằm đảm bảo nhu cầu tiêu dùng trong nước và nhu cầu xuất khẩu ngày càng tăng."],1],
[25,"Nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong nông lâm ngư nghiệp cần gắn với vấn đề gì?",["Gắn với việc giải quyết tốt các vấn đề xã hội như xoá đói giảm nghèo, nâng cao dân trí, chăm sóc sức khoẻ, đền ơn đáp nghĩa, nâng cao đời sống vật chất, tinh thần cho nhân dân, xây dựng nông thôn văn minh và hiện đại.","Gắn với việc xây dựng cơ sở hạ tầng như điện, đường, trường, trạm.","Gắn với việc xây dựng quy hoạch, kế hoạch thực hiện CNH, HĐH nông nghiệp, nông thôn.","Gắn với việc động viên, khuyến khích nhân dân thực hiện kết hợp Nhà nước và nhân dân cùng làm."],0],
[26,"Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong giao thông vận tải là gì?",["Xây dựng hệ thống giao thông vận tải đáp ứng nhu cầu phát triển kinh tế - xã hội, quốc phòng - an ninh.","Trong xây dựng mạng lưới đường bộ phải tính toán đến nhu cầu của quốc phòng, an ninh.","Xây dựng kế hoạch động viên giao thông vận tải cho thời chiến.","Cần chú trọng nâng cấp các tuyến đường, hệ thống sân bay, bến cảng phục vụ cả thời bình và thời chiến."],2],
[27,"Để kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh thì trong XD cơ bản khi cấp phép đầu tư XD cho các đối tác nước ngoài cần đảm bảo yêu cầu nào?",["Phải được chính phủ thẩm định phê duyệt cấp phép.","Phải có sự tham gia ý kiến của cơ quan quân sự có thẩm quyền.","Phải thành lập Hội đồng thẩm định có đầy đủ các bộ ngành liên quan.","Đối tác nước ngoài phải trình dự án với Hội đồng đảm bảo các yêu cầu của Chính phủ QĐ."],1],
[28,"Vị trí vai trò của khoa học và công nghệ, giáo dục đối với sự phát triển đất nước là gì?",["Là chiến lược, sách lược hàng đầu đối với sự phát triển của quốc gia.","Là động lực quan trọng thúc đẩy sự phát triển của quốc gia.","Là những yếu tố có vai trò quyết định đến sự phát triển của quốc gia.","Đóng vai trò là nền tảng, động lực, là quốc sách hàng đầu đối với sự phát triển của quốc gia."],3],
[29,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong lĩnh vực khoa học và công nghệ, giáo dục cần tập trung nội dung nào?",["Cần ưu tiên đầu tư phát triển khoa học và công nghệ phục vụ cho nhu cầu QP, AN.","Nghiên cứu ban hành chính sách khuyến khích các tổ chức cá nhân có đề tài khoa học, dự án công nghệ và sản xuất các sản phẩm có ý nghĩa.","Nhà nước cần có chính sách đầu tư thích đáng cho các dự án các đề tài.","Cần có chiến lược phát triển khoa học và công nghệ giáo dục đáp ứng nhu cầu công nghiệp hoá, HĐH đất nước."],1],
[30,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong lĩnh vực y tế cần chú ý nội dung nào?",["Phát huy vai trò y tế dân sự, sẵn sàng động viên khi có chiến tranh.","Cần có chiến lược đào tạo nguồn nhân lực đáp ứng nhu cầu xã hội và quốc phòng, an ninh.","Phát huy vai trò quân, dân y trên cả nước đặc biệt là các địa bàn chiến lược.","Xây dựng kế hoạch động viên y tế dân sự cho quân sự khi có chiến tranh xảy ra."],3],
[31,"Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong thực hiện nhiệm vụ chiến lược bảo vệ Tổ quốc là gì?",["Tổ chức biên chế, bố trí LLVT phù hợp với điều kiện kinh tế và nhu cầu phòng thủ đất nước.","Xây dựng lực lượng vũ trang chính quy, tinh nhuệ, từng bước hiện đại đáp ứng nhu cầu bảo vệ Tổ quốc.","Cần có chiến lược đào tạo, bồi dưỡng nguồn nhân lực đáp ứng nhiệm vụ xây dựng và bảo vệ Tổ quốc.","Phát huy tốt vai trò tham mưu của các cơ quan quân sự, công an trong XD chiến lược phòng thủ đất nước."],0],
[32,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong lĩnh vực đối ngoại cần tập trung nội dung nào?",["Trong lĩnh vực kinh tế đối ngoại phải đề cao cảnh giác khi lựa chọn đối tác đầu tư.","Trong liên kết đầu tư với nước ngoài cần chú ý quan tâm đến nhu cầu quốc phòng, bảo đảm quốc phòng, an ninh.","Kết hợp trong việc phân bổ đầu tư vào ngành nào, địa bàn nào có lợi cho phát triển kinh tế, bảo đảm quốc phòng, an ninh của quốc gia.","Kết hợp trong xây dựng và quản lý các dự án, đặc biệt là dự án 100% vốn nước ngoài."],2],
[33,"Để nâng cao hiệu lực quản lý Nhà nước của chính quyền các cấp trong kết hợp phát triển kinh tế xã hội với tăng cường củng cố QP, AN cần phải làm gì?",["Xdựng và chỉ đạo thực hiện tốt các quy trình, phương pháp quản lý, điều hành của chính quyền các cấp.","Thường xuyên nắm vững chủ trương đường lối của Đảng kịp thời đề ra các nghị quyết lãnh đạo sát đúng.","Tổ chức tốt việc sơ kết, tổng kết rút kinh nghiệm kịp thời để bổ sung chủ trương và chỉ đạo thực hiện.","Từng cấp phải làm đúng chức năng, NV theo quy định của PL và nghị định 119/2004/NĐ-CP của Chính phủ."],3],
[34,"Vai trò lãnh đạo của các cấp ủy Đảng trong việc kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh được thể hiện ở chỗ nào?",["Từng cấp phải làm đúng chức năng, nhiệm vụ theo quy định của pháp luật và nghị định của Chính phủ.","Xây dựng và chỉ đạo thực hiện tốt các chỉ thị, nghị quyết của các cấp ủy Đảng.","Thường xuyên nắm vững chủ trương đường lối của Đảng, kịp thời đề ra các nghị quyết lãnh đạo ngành, địa phương mình một cách đúng đắn.","Thường xuyên đôn đốc, kiểm tra việc thực hiện NQ và tổ chức tốt việc sơ kết, tổng kết rút kinh nghiệm."],2],
[35,"Vai trò của kinh tế đối với QP, AN như thế nào?",["Kinh tế quyết định sự lớn mạnh và phát triển của QP, AN.","Kinh tế quyết định đến sự tồn tại và phát triển lâu dài của QP, AN.","Kinh tế quyết định đến việc biên chế trang bị vũ khí, phương tiện cho quốc phòng, an ninh.","Kinh tế quyết định đến việc cung cấp số lượng, chất lượng nguồn nhân lực cho QP, AN."],3],
[36,"Quốc phòng, an ninh tác động trở lại kinh tế như thế nào?",["Hoạt động quốc phòng, an ninh tiêu tốn đáng kể một phần nguồn nhân lực, vật lực, tài chính của xã hội, là tiêu dùng “mất đi”.","Hoạt động quốc phòng, AN còn ảnh hưởng đến đường lối phát triển kinh tế, cơ cấu kinh tế.","Hoạt động quốc phòng, an ninh còn có thể dẫn đến hủy hoại môi trường sinh thái, để lại hậu quả nặng nề cho kinh tế, nhất là khi chiến tranh xảy ra.","Cả ba nội dung trên."],3],
[37,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong các ngành, các lĩnh vực kinh tế chủ yếu nào?",["Kết hợp trong công nghiệp.","Kết hợp trong nông, lâm, ngư nghiệp.","Kết hợp trong giao thông vận tải, bưu điện, y tế, khoa học-công nghệ, giáo dục và xây dựng cơ bản.","Cả ba nội dung trên."],3],
[38,"Giải pháp: Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế-xã hội với tăng cường củng cố quốc phòng, an ninh cho các đối tượng, cần tập trung chú ý những giải pháp chủ yếu gì?",["Đối tượng bồi dưỡng.","Nội dung bồi dưỡng.","Hình thức bồi dưỡng.","Cả ba giải pháp trên."],3],
[39,"Nhiệm vụ của các nhà máy công nghiệp quốc phòng trong thời bình là gì?",["Từng bước tự sản xuất vũ khí, trang bị, phương tiện đáp ứng nhu cầu của lực LL vũ trang.","Mở rộng liên doanh liên kết giữa các nhà máy công nghiệp Qphòng với công nghiệp các nước tiên tiến.","Ngoài việc sản xuất ra hàng quân sự phải tham gia sản xuất hàng dân sự chất lượng cao phục vụ tiêu dùng và XK.","Ngoài việc sản xuất vũ khí trang bị cho quân đội cần tham gia phát triển kinh tế, xã hội có hiệu quả cao."],2],
[40,"Đối với vùng núi biên giới, việc kết hợp thực hiện phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh cần thực hiện nội dung nào?",["Xây dựng phương án đối phó với các tình huống có thể xảy ra ở vùng biên giới.","Thực hiện tốt chương trình xóa đói giảm nghèo, chương trình 135 về phát triển kinh tế - xã hội đối với các xã nghèo.","Xây dựng quy hoạch, kế hoạch từng bước đưa dân định canh, định cư.","Xây dựng cơ chế chính sách tạo điều kiện phát triển kinh tế của cửa khẩu."],1],
[41,"Hoạt động kinh tế là quá trình hoạt động như thế nào?",["Là quá trình lao động sản xuất ra của cải vật chất cho xã hội.","Là quá trình hoạt động sản xuất kinh doanh có hiệu quả.","Là quá trình tổ chức lao động, sản xuất một cách hợp lý.","Là quá trình hoạt động sản xuất và tái sản xuất ra của cải vật chất cho xã hội."],3],
[42,"Để xây dựng QP, AN vững mạnh cần phải làm gì ?",["Cần phải tăng cường ngân sách nhiều hơn cho QP, AN.","Cần phải trang bị chính quy hiện đại cho QP, AN.","Cần có chiến lược phát triển quốc phòng, an ninh.","Cần phải xây dựng, phát triển kinh tế."],3],
[43,"Một trong những vấn đề lớn trong cương lĩnh 2011 về mục tiêu phát triển KT-XH 2011-2020 là gì?",["Phấn đấu đến năm 2020 nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại","Phát triển kinh tế - xã hội gắn với phát triển quốc phòng, an ninh.","Đưa nước ta trở thành một nước công nghiệp hiện đại.","Hoàn thành thắng lợi các nhiệm vụ trong giai đoạn quá độ."],0],
[44,"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong thực hiện nhiệm vụ chiến lược bảo vệ Tổ quốc có mấy nội dung?",["3 nội dung","4 nội dung","5 nội dung","6 nội dung"],1],
[45,"Người Việt Nam muốn tồn tại, bảo vệ cuộc sống và nền văn hoá của mình chỉ có con đường duy nhất là gì?",["Đánh đuổi đế quốc, bảo vệ Tổ quốc.","Đánh đuổi đế quốc thực dân, bảo vệ đất nước.","Đánh đuổi phong kiến thực dân, bảo vệ Tổ quốc.","Đoàn kết đứng lên đánh giặc, giữ nước."],3],
[46,"Về tư tưởng chỉ đạo tác chiến trong nghệ thuật đánh giặc của ông cha ta là gì?",["Kiên quyết không ngừng thế tiến công.","Kiên quyết phòng thủ bảo vệ đất nước.","Thực hiện tiến công liên tục mọi lúc, mọi nơi, từ cục bộ đến toàn bộ.","Thực hiện kết hợp tiến công và phòng thủ."],2],
[47,"Một trong những nội dung dùng mưu đánh giặc trong nghệ thuật Qsự của ông cha ta là gì?",["Lừa địch để đánh vào chỗ yếu, chỗ sơ hở, chỗ ít phòng bị, làm cho chúng bị động, lúng túng đối phó.","Lừa địch đánh vào chỗ yếu khi chúng sơ hở làm cho địch lúng túng đối phó.","Điều địch theo kế hoạch của ta, giành quyền chủ động.","Lấy số lượng ít, đánh với số lượng nhiều."],0],
[48,"Một trong những nội dung dùng kế đánh giặc trong nghệ thuật Qsự của ông cha ta là gì?",["Để điều địch theo ý định của ta, giành quyền chủ động buộc chúng phải đánh theo cách của ta.","Lừa địch đánh vào chỗ yếu làm cho địch lúng túng đối phó.","Lừa địch để đánh vào chỗ yếu, chỗ sơ hở, chỗ ít phòng bị","Lừa địch làm cho chúng bị động, lúng túng đối phó."],0],
[49,"Nội dung của nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?",["Chiến lược quân sự","Nghệ thuật chiến dịch.","Chiến thuật.","Cả ba yếu tố trên."],3],
[50,"Chiến lược quân sự trong nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?",["Là tổng thể phương châm, chính sách quân sự","Là tổng thể mưu lược được hoạch định tiến hành chiến tranh thắng lợi.","Là tổng thể phương châm, chính sách được sử dụng trong thời chiến.","Là tổng thể phương châm, chính sách và mưu lược được hoạch định để ngăn ngừa và sẵn sàng tiến hành chiến tranh thắng lợi."],3],
[51,"Một trong những nội dung của chiến lược quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?",["Xác định đúng kẻ thù, đúng đối tượng tác chiến.","Xây dựng ý chí kiên cường, tinh thần yêu nước cho toàn dân tộc.","Phát huy sức mạnh của cả dân tộc và thời đại trong chiến tranh bảo vệ Tổ quốc.","Thực hiện tốt chiến tranh nhân dân trong chiến tranh bảo vệ Tổ quốc."],0],
[52,"Nghệ thuật chiến dịch trong nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?",["Là lý luận và thực tiễn chuẩn bị thực hành chiến tranh","Là tổng thể những kế hoạch để tiến hành chiến tranh thắng lợi.","Là tổng thể phương châm, chính sách được sử dụng trong thời chiến.","Là lý luận và thực tiễn chuẩn bị, thực hành chiến dịch và các hoạt động tác chiến tương đương."],3],
[53,"Trong chiến dịch Điện Biên Phủ ta thay đổi phương châm tác chiến như thế nào?",["Đánh nhanh, thắng nhanh sang đánh chắc, tiến chắc.","Đánh nhanh, thắng nhanh sang đánh chiếm từng phần","Đánh nhanh, thắng nhanh sang táo bạo thần tốc.","Đánh nhanh, thắng nhanh sang vây lấn."],0],
[54,"Chiến thuật trong nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?",["Là lí luận và thực tiễn về tổ chức và thực hành chiến đấu của phân đội, binh đội, binh đoàn LLVT","Là lí luận và thực hành chiến đấu của phân đội, binh đội, binh đoàn LLVT","Là lý luận và thực tiễn chuẩn bị, thực hành chiến dịch và các hoạt động tác chiến tương đương.","Là lí luận và cách đánh trong chiến đấu của các phân đội, binh đội, binh đoàn LLVT"],0],
[55,"Chiến dịch phòng ngự Thượng Đức diễn ra năm nào?",["Năm 1971.","Năm 1972.","Năm 1973.","Năm 1974."],3],
[56,"Năm 1974 trong chiến tranh giải phóng đã diễn ra chiến dịch phòng ngự nổi tiếng nào?",["Chiến dịch phòng ngự Quảng Trị.","Chiến dịch phòng ngự Tây Nguyên.","Chiến dịch phòng ngự đường 9.","Chiến dịch phòng ngự Thượng Đức."],3],
[57,"Năm 1972 trong chiến tranh giải phóng đã diễn ra chiến dịch phòng ngự nổi tiếng nào?",["Chiến dịch phòng ngự Quảng Trị.","Chiến dịch phòng ngự Tây Nguyên.","Chiến dịch phòng ngự đường 9.","Chiến dịch phòng ngự Thượng Đức."],0],
[58,"Trong bài học kinh nghiệm thứ nhất, đã chỉ rõ kẻ thù của đất nước ta ngày nay là đối tượng nào?",["Đế quốc Mỹ và bọn phản động.","Chủ nghĩa đế quốc và các thế lực thù địch.","Lực lượng phản động quốc tế.","Các thế lực thù địch ở trong và ngoài nước."],1],
[59,"Hoạt động tác chiến của LL vũ trang trong Nghệ thuật quân sự toàn dân đánh giặc là gì?",["Kết hợp đánh phân tán, tập trung với bao vây chia cắt .","Kết hợp đánh nhỏ, đánh vừa với tập trung.","Kết hợp đánh vừa, đánh lớn với bao vây.","Kết hợp đánh phân tán, tập trung, kết hợp đánh nhỏ, đánh vừa, đánh lớn."],3],
[60,"Một trong những bài học kinh nghiệm về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới đó là gì?",["Mưu kế đánh giặc, mềm dẻo trong chiến đấu kết hợp tiến công với binh vận.","Thực hiện toàn dân, đánh giặc tập trung lực lượng xây dựng tuyến phòng thủ vững chắc.","Tư tưởng chiến đấu của nhân dân biết mở đầu và kết thúc chiến tranh đúng lúc.","Quán triệt tư tưởng lấy ít đánh nhiều, biết tập trung ưu thế lực lượng cần thiết để đánh thắng địch."],3],
[61,"Bài học kinh nghiệm thứ năm về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới là nội dung nào dưới đây ?",["Kết hợp tiêu hao, tiêu diệt địch với bảo vệ vững chắc các mục tiêu.","Quán triệt tư tưởng lấy ít địch nhiều kết hợp với tiến công liên tục.","Nghệ thuật toàn quân đánh giặc kết hợp với đánh lớn đánh vừa.","Nghệ thuật dùng sức mạnh tổng hợp các thành phần lực lượng với bao vây chia cắt."],0],
[62,"Bài học kinh nghiệm thứ nhất về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới là gì?",["Quán triệt tư tưởng tích cực tiến công.","Kết hợp tiêu hao tiêu diệt với bảo vệ vững chắc các mục tiêu đảm nhiệm.","Nghệ thuật quân sự toàn dân đánh giặc cả nước là một chiến trường.","Nghệ thuật tạo sức mạnh tổng hợp bằng lực, thế, thời và mưu kế."],0],
[63,"Kế sách đánh giặc của ông cha ta là gì?",["Tập trung lực lượng xây dựng tuyến phòng thủ vững chắc.","Đánh nhanh thắng nhanh, nhanh chóng tiêu hao tiêu diệt địch ngay từ đầu.","Mềm dẻo với khôn khéo, kết hợp tiến công quân sự với binh vận, ngoại giao, tạo thế mạnh của ta, phá thế mạnh của địch.","Né tránh thế mạnh của địch, quân chủ lực kết hợp với quân địa phương tiến hành CT."],2],
[64,"Nghiên cứu nghệ thuật của các thế hệ ông cha ta, chúng ta có cảm nghĩ gì?",["Có quyền tự hào về tinh thần dũng cảm, ý chí kiên cường trong chống giặc ngoại xâm để bảo vệ non sông đất nước.","Tự hào về tinh thần chiến đấu của nhân dân và sẵn sàng tuyên chiến với mọi quân đội, mọi quốc gia.","Tin vào sự bất khả xâm phạm của đất nước ta, không sợ một quốc gia nào.","Tự hào truyền thống chiến đấu kiên cường,bền bỉ, sự chịu đựng nhẫn nhịn của ông cha ta."],0],
[65,"Nghiên cứu nghệ thuật quân sự, rút ra các bài học kinh nghiệm về nghệ thuật quân sự trong sự nghiệp bảo vệ Tổ quốc thời kỳ mới, một trong những trách nhiệm của sinh viên là gì?",["Tự hào về lịch sử của đất nước ta và yên tâm học tập công tác không lo có kẻ thù xâm lược.","Yên tâm học tập công tác không phải lo công việc bảo vệ Tổ quốc vì không có kẻ thù xâm lược.","Phải phấn đấu, tu dưỡng để trở thành những công dân tốt, sẵn sàng làm nhiệm vụ khi Tổ quốc cần.","Yên tâm học tập công tác vì đã có lực lượng quân đội hùng mạnh chiến thắng mọi kẻ thù."],2],
[66,"Nghiên cứu nghệ thuật quân sự Việt Nam, rút ra các bài học kinh nghiệm về nghệ thuật quân sự trong sự nghiệp bảo vệ Tổ quốc thời kỳ mới, một trong những trách nhiệm của sinh viên là gì?",["Phát huy tinh thần tự lực, vượt qua khó khăn để hoàn thành nhiệm vụ học tập, đặc biệt là không ngừng bồi đắp lòng yêu quê hương đất nước.","Phát huy tinh thần tự giác,cố gắng học tập và rèn luyện.","Phát huy tính độc lập, tự lực, tự cường để học tập và công tác.","Phát huy tính tự chủ, tự cường, tham gia tốt các hoạt động xã hội."],0],
[67,"Ông cha ta kết hợp đấu tranh giữa các mặt trận quân sự, chính trị, ngoại giao, binh vận nhằm mục đích gì?",["Nhằm tổ chức lực lượng lớn hơn địch để thắng chúng.","Nhằm tạo ra sức mạnh tổng hợp, giành thắng lợi trong chiến tranh.","Nhằm phát huy sức mạnh của từng yếu tố.","Có lực lượng lớn hơn địch để thắng chúng."],1],
[68,"Trong nội dung đánh giặc của tổ tiên, mặt trận ngoại giao có vị trí quan trọng như thế nào?",["Là mặt quan trọng, kết hợp với tiến công địch toàn diện.","Là mặt trận có vị trí rất quan trọng, đề cao tính chính nghĩa của nhân dân ta, phân hóa, cô lập kẻ thù, tạo thế có lợi cho cuộc chiến, kết hợp với mặt trận quân sự, chính trị tạo thế có lợi để kết thúc chiến tranh càng sớm càng tốt.","Là mặt trận giữ vững quyền chủ động, tạo điều kiện cho quân sự.","Là mặt trận động viên tinh thần chiến đấu, là cơ sở cho mặt trận quân sự."],1],
[69,"Trong nghệ thuật đánh giặc của ông cha ta, vị trí của mặt trận chính trị được xác định như thế nào?",["Mặt trận cổ vũ tinh thần yêu nước của nhân dân, quy tụ sức mạnh đại đoàn kết dân tộc, là cơ sở để tạo ra sức mạnh quân sự.","Là cơ sở tạo sức mạnh quân sự, ngoại giao, binh vận.","Cùng với quân sự quyết định sức mạnh của chiến trường.","Là cơ sở tạo sức mạnh quân sự, ngoại giao."],0],
[70,"Trong nội dung nghệ thuật quân sự của ông cha ta, vị trí của mặt trận quân sự được xác định như thế nào?",["Quyết định thắng lợi trực tiếp của chiến tranh.","Là mặt trận cơ bản chi phối các mặt trận khác.","Là mặt trận xung kích cổ vũ tinh thần yêu nước.","Có tính quyết định làm thay đổi mối quan hệ đối ngoại giữa các quốc gia trong chiến tranh."],0],
[71,"Nền văn minh sông Hồng còn có tên gọi là gì ?",["Văn hoá Bắc bộ.","Văn hoá lúa nước.","Văn minh Văn Lang.","Văn minh Hùng Vương."],2],
[72,"Để bảo vệ đất nước, bảo vệ sự trường tồn của dân tộc, ông cha ta đã làm gì?",["Đoàn kết và phát huy tối đa ưu thế của địa hình để lập thế trận đánh giặc.","Đoàn kết và phát huy tốt thế trận địa hình để đánh giặc bảo vệ Tổ quốc.","Xây dựng thế trận phòng thủ đánh giặc giữ nước.","Xây dựng thế trận khu vực phòng thủ bảo vệ Tổ quốc."],0],
[73,"Có mấy yếu tố tác động đến nghệ thuật đánh giặc của ông cha ta?",["3 yếu tố.","4 yếu tố.","5 yếu tố.","6 yếu tố."],0],
[74,"Dân quân tự vệ là lực lượng gì?",["Là lực lượng vũ trang có tổ chức; là thành phần của lực lượng vũ trang nhân dân nước CHXHCNVN.","Là lực lượng vũ trang chuyên nghiệp; là thành phần của lực lượng vũ trang nhân dân nước CHXHCNVN.","Là lực lượng vũ trang cách mạng; là thành phần của lực lượng vũ trang nhân dân nước CHXHCNVN.","Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác; là thành phần của lực lượng vũ trang nhân dân nước Cộng hòa xã hội chủ nghĩa Việt Nam."],3],
[75,"Dưới sự lãnh đạo của Đảng, dân quân tự vệ có vị trí, vai trò như thế nào?",["Là một lực lượng chủ yếu trong chiến tranh nhân dân, quốc phòng toàn dân, làm nòng cốt cho toàn dân đánh giặc bảo vệ Tổ quốc, bảo vệ địa phương.","Là một lực lượng quan trọng trong chiến tranh nhân dân, quốc phòng toàn dân, làm nòng cốt cho toàn dân đánh giặc bảo vệ Tổ quốc, bảo vệ địa phương.","Là một lực lượng chiến lược trong chiến tranh nhân dân, quốc phòng toàn dân, làm nòng cốt cho toàn dân đánh giặc bảo vệ Tổ quốc, bảo vệ địa phương.","Là một lực lượng xung kích trong chiến tranh nhân dân, quốc phòng toàn dân, làm nòng cốt cho toàn dân đánh giặc bảo vệ Tổ quốc, bảo vệ địa phương."],2],
[76,"Lực lượng dân quân tự vệ là một trong những công cụ chủ yếu để bảo vệ độc lập chủ quyền, toàn vẹn lãnh thổ đất nước, bảo vệ Đảng, chính quyền, bảo vệ tính mạng và tài sản của NN và ND ở tại cấp nào?",["Cấp tỉnh (thành phố).","Cấp quân khu.","Tại địa phương, cơ sở.","Trên phạm vi cả nước"],2],
[77,"Xây dựng lực lượng dân quân tự vệ theo phương hướng nào?",["Vững mạnh","Rộng khắp.","Coi trọng chất lượng là chính.","Cả 3 ý trên."],3],
[78,"Một trong những phương hướng xây dựng dân quân tự vệ là gì?",["Coi trọng nâng cao quân số và vũ khí trang bị.","Coi trọng nâng cao chất lượng vũ khí trang thiết bị hiện đại là chính.","Coi trọng chất lượng là chính.","Coi trọng nâng cao quân số trên phạm vi cả nước"],2],
[79,"Một trong những biện pháp xây dựng dân quân tự vệ trong giai đoạn hiện nay là gì?",["Xây dựng lực lượng dân quân tự vệ gắn với xây dựng nông thôn mới.","Xây dựng lực lượng dân quân tự vệ gắn với xây dựng cơ sở vững mạnh toàn diện.","Xây dựng lực lượng dân quân tự vệ gắn với xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.","Xây dựng lực lượng dân quân tự vệ gắn với xây dựng khu vực phòng thủ."],1],
[80,"Lực lượng dự bị động viên bao gồm những thành tố nào?",["Gồm quân nhân dự bị và phương tiện kĩ thuật đã xếp trong kế hoạch bổ sung cho lực lượng thường trực của quân đội.","Gồm quân nhân dự bị và phương tiện kĩ thuật ngoài kế hoạch bổ sung cho LL thường trực của quân đội.","Gồm quân nhân dự bị và phương tiện kĩ thuật không xếp trong kế hoạch bổ sung cho lực lượng thường trực của quân đội.","Gồm quân nhân dự bị và phương tiện kĩ thuật không trong kế hoạch bổ sung cho LL thường trực của quân đội."],0],
[81,"Danh mục phương tiện kỹ thuật của lực lượng dự bị động viên do cấp nào quy định?",["Bộ Quốc phòng.","Chính phủ.","Uỷ ban nhân dân tỉnh (thành phố).","Bộ chỉ huy quân sự tỉnh (thành phố)."],1],
[82,"Quân nhân dự bị, phương tiện kĩ thuật trong kế hoạch biên chế cho lực lượng thường trực của quân đội như thế nào?",["Thông qua các đơn vị huấn luyện.","Thông qua các đơn vị dự bị động viên.","Thông qua các đơn vị chiến đấu.","Thông qua các đơn vị phục vụ chiến đấu."],1],
[83,"Nội dung quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là gì?",["Xây dựng lực lượng dự bị động viên bảo đảm số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm.","Xây dựng lực lượng dự bị động viên phải phát huy sức mạnh tổng hợp của cả hệ thống chính trị.","Xây dựng lực lượng dự bị động viên đặt dưới sự lãnh đạo của Đảng các cấp ở địa phương, bộ, ngành.","Cả 3 ý trên."],3],
[84,"Một trong những quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là gì?",["Xây dựng lực lượng dự bị động viên bảo đảm số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm.","Xây dựng lực lượng dự bị động viên phải có sức mạnh như lực lượng quân thường trực.","Xây dựng lực lượng dự bị động viên đặt dưới sự quản lý chặt chẽ của các tổ chức Đảng trong Quân đội.","Xây dựng lực lượng dự bị động viên phải có đầy đủ vũ khí trang kỹ thuật hiện đại."],0],
[85,"Tổ chức các đơn vị dự bị động viên theo phương thức nào?",["Đơn vị sẵn sàng chiến đấu.","Đơn vị chuyên môn nghiệp vụ.","Đơn vị biên chế khung thường trực và đơn vị không biên chế khung thường trực.","Đơn vị bảo đảm hậu cần - kĩ thuật."],2],
[86,"Động viên công nghiệp quốc phòng không áp dụng đối với các doanh nghiệp công nghiệp nào?",["Doanh nghiệp Nhà nước.","Doanh nghiệp có vốn đầu tư nước ngoài tại Việt Nam","Doanh nghiệp tư nhân.","Doanh nghiệp cổ phần."],1],

const A={};Q.forEach(q=>A[q[0]]=q);
let part=1,list=[],ans={},done=false;
const $=s=>document.querySelector(s);
const all=p=>Q.filter(q=>p==1?q[0]<=50:q[0]>50).map(q=>q[0]);
function start(p,ids){part=p;list=ids||all(p);ans={};done=false;draw();scrollTo(0,0)}
function wrong(){return list.filter(i=>ans[i]!==A[i][3])}
function submit(){done=true;draw();scrollTo(0,0)}
function upd(){$('#cnt').textContent=Object.keys(ans).length}
function draw(){
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p==part));
 $('#list').innerHTML=list.length?list.map(id=>{const q=A[id];return '<section class="q"><p><b>Câu '+id+'.</b> '+q[1]+'</p>'+q[2].map((o,i)=>{const c=done?(i==q[3]?' ok':ans[id]===i?' no':''):'';return '<label class="o'+c+'"><input type="radio" name="q'+id+'"'+(done?' disabled':'')+(ans[id]===i?' checked':'')+' onchange="ans['+id+']='+i+';upd()"><span><b>'+'ABCD'[i]+'.</b> '+o+'</span></label>'}).join('')+'</section>'}).join(''):'<p class="note">Phần này chưa có câu hỏi.</p>';
 const w=wrong();
 $('#info').innerHTML=!list.length?'':done?'<div class="res">Kết quả: <b>'+(list.length-w.length)+'/'+list.length+'</b> câu đúng</div>':'<div class="res">Đã làm <b id="cnt">'+Object.keys(ans).length+'</b>/'+list.length+' câu</div>';
 $('#bar').innerHTML=!list.length?'':done?'<button onclick="start(part)">Làm lại</button><button onclick="start(part,wrong())"'+(w.length?'':' disabled')+'>Làm lại câu sai ('+w.length+')</button>':'<button class="pri" onclick="submit()">Nộp bài</button>';
}
start(1);
</script></body></html>
